[project]
name = "decide-distill"
version = "0.1.0"
description = "Turn LLM decision logs into a local, calibrated decision model"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Frozen d1-3B features. The model card requires transformers>=5.14 and trust_remote_code.
d1 = ["torch", "transformers>=5.14", "torchvision", "pillow"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["distill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
